name: Bug report
description: Report a reproducible problem without secrets or real customer data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities publicly; follow SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic data and redact credentials.
      placeholder: "1. Start...\n2. Submit...\n3. Observe..."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent workflow
        - RAG or memory
        - Tool or authorization
        - API or database
        - Worker or reliability
        - Frontend
        - Evaluation or monitoring
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node version, and offline or model-enabled mode.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized logs
      render: shell
